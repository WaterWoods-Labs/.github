name: Validate community files

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Community validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check -r requirements-validation.txt
      - name: Validate repository
        run: python scripts/validate_repository.py
      - name: Verify rejected input cases
        run: python -m unittest discover -s tests -v
